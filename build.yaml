include:
  # SuperMini nRF52840 is pin-compatible with the nice!nano v2, which is the
  # board target used for it in ZMK.
  - board: nice_nano_v2
    shield: sofle_choc_dongle
  - board: nice_nano_v2
    shield: sofle_choc_left
  - board: nice_nano_v2
    shield: sofle_choc_right

  # Flash these first, once, to clear old bond/pairing data.
  - board: nice_nano_v2
    shield: settings_reset
