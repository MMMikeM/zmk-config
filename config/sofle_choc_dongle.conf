# Dongle-only settings. Loaded in addition to sofle_choc.conf.

# Always plugged into USB - never sleep, it must stay listening for the halves.
CONFIG_ZMK_SLEEP=n

# USB is the only output (no &out key in the keymap). BLE stays on because the
# dongle needs it as the split central - it is how the halves connect.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
