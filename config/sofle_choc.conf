# Applies to both halves and the dongle.

# Mouse/scroll support (encoder scroll + &mkp if ever needed)
CONFIG_ZMK_POINTING=y

# Sleep after 30 min idle to save battery on the halves
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# No OLED / RGB on this build
# CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_RGB_UNDERGLOW=y
