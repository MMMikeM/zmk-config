# Right half - split peripheral. Loaded in addition to sofle_choc.conf.

# Encoder interrupt handling. EC11 itself enables automatically via
# `depends on DT_HAS_ALPS_EC11_ENABLED`; this only picks the trigger mode out of
# the EC11_TRIGGER_MODE choice.
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# The nice!nano board defconfig turns USB on, but a split peripheral cannot be a
# USB endpoint, so Kconfig warns about the unsatisfiable dependency. Turning it
# off here keeps the build clean. Flashing over USB is unaffected - that happens
# in the bootloader, not the application.
CONFIG_ZMK_USB=n
